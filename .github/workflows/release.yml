# Owner: release. Signed bundles + updater manifest on every `v*` tag.
#
# Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY           contents of the updater private key (minisign)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (empty for a password-less key)
#
# Flow: create a draft release -> each OS builds and uploads its bundles,
# `.sig` files and merges `latest.json` -> publish the draft, which makes
# https://github.com/<repo>/releases/latest/download/latest.json live.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - id: create
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Release notes = this version's CHANGELOG.md section (fallback: the tag).
          ver="${TAG#v}"
          awk -v v="$ver" '/^## /{p=($2==v)} p' CHANGELOG.md | sed '1s/^## [0-9.]* *[^ ]* */## /' > notes.md || true
          [ -s notes.md ] || echo "MineDed $TAG" > notes.md
          printf '\nУстановленный лаунчер обновится сам. Сайт: https://mineded.dedseckms.ru\n' >> notes.md
          # Reuse an existing (draft) release for this tag, else create one.
          # Draft releases are not returned by /releases/tags/<tag>, so list them.
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$TAG\")][0].id // empty")
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f name="MineDed $TAG" -F body=@notes.md \
              -F draft=true --jq .id)
          fi
          test -n "$id"
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux system deps (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev libx11-dev libxdo-dev pkg-config patchelf libssl-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          releaseId: ${{ needs.draft.outputs.release_id }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

  publish:
    needs: [draft, build]
    runs-on: ubuntu-22.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ needs.draft.outputs.release_id }}
        run: |
          test -n "$ID"
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false -f make_latest=true
