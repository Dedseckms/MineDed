[workspace]
resolver = "2"
members = [
    "crates/lc-types",
    "crates/lc-runtime",
    "crates/lc-http",
    "crates/lc-core",
    "crates/lc-loaders",
    "crates/lc-content",
    "crates/lc-accounts",
    "crates/lc-vpn",
    "crates/lc-p2p",
    "crates/lc-voice",
    "apps/desktop/src-tauri",
    "server/hub",
]

[workspace.package]
version = "1.0.5"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.85"

[workspace.dependencies]
# internal
lc-types = { path = "crates/lc-types" }
lc-runtime = { path = "crates/lc-runtime" }
lc-http = { path = "crates/lc-http" }
lc-core = { path = "crates/lc-core" }
lc-loaders = { path = "crates/lc-loaders" }
lc-content = { path = "crates/lc-content" }
lc-accounts = { path = "crates/lc-accounts" }
lc-vpn = { path = "crates/lc-vpn" }
lc-p2p = { path = "crates/lc-p2p" }
lc-voice = { path = "crates/lc-voice" }

# external (exact versions are pinned in Cargo.lock)
async-trait = "0.1.92"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7.20"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
url = { version = "2.5.8", features = ["serde"] }
reqwest = { version = "0.13.5", features = ["json"] }
specta = { version = "=2.0.0-rc.25", features = ["derive", "uuid", "url"] }
specta-typescript = "=0.0.12"
tauri = { version = "2.12.4", features = ["protocol-asset"] }
tauri-build = { version = "2.7.3", features = [] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
axum = { version = "0.8.9", features = ["ws"] }
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.5"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
