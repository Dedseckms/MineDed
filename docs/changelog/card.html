<!doctype html>
<!-- Release card for Telegram posts (1280x640). Generated by docs/changelog/make-cards.ps1:
     card.html#v=1.2.1&t=Title&s=forest -->
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../site/style.css">
<style>
  :root { color-scheme: dark; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body { display: grid; place-items: center; }
  .card { width: 1040px; max-width: none; padding: 44px 56px; display: grid; grid-template-columns: 150px 1fr; gap: 36px; align-items: center; }
  .card img { width: 150px; height: 150px; image-rendering: pixelated; }
  .ver { margin: 0 !important; font-size: 30px !important; font-weight: 800 !important; color: #4ade80 !important; letter-spacing: .02em; }
  .ttl { margin: 6px 0 0; font-size: 58px; line-height: 1.1; }
  .brand { margin: 18px 0 0 !important; font-size: 22px !important; color: #9aa4b2 !important; }
</style>
</head>
<body>
<div id="bg" class="bg" aria-hidden="true"></div>
<div class="card panel">
  <img src="../../site/logo.svg" alt="">
  <div>
    <p class="ver" id="ver"></p>
    <h1 class="ttl" id="ttl"></h1>
    <p class="brand">MineDed — лаунчер Minecraft для игры с друзьями</p>
  </div>
</div>
<script src="../../site/scenes.js"></script>
<script>
  var p = new URLSearchParams(location.hash.slice(1));
  document.getElementById("ver").textContent = "Обновление " + (p.get("v") || "");
  document.getElementById("ttl").textContent = p.get("t") || "";
  var ids = window.MineupScenes.ids;
  var scene = p.get("s") || ids[0];
  document.getElementById("bg").innerHTML = window.MineupScenes.render(scene, false);
</script>
</body>
</html>
