[package]
name = "desktop"
description = "Tauri shell: command registration and wiring of services. Owner: lead (+ per-role commands/*.rs)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
lc-types.workspace = true
lc-runtime.workspace = true
lc-http.workspace = true
lc-core.workspace = true
lc-loaders.workspace = true
lc-content.workspace = true
lc-accounts.workspace = true
lc-vpn.workspace = true
lc-p2p.workspace = true
lc-voice.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri.workspace = true
tauri-specta.workspace = true
tokio.workspace = true
url.workspace = true
# release: self-update (signed bundles, mirrored latest.json)
tauri-plugin-updater = "2.10"
# release: native file-open dialog (capability: dialog:allow-open only)
tauri-plugin-dialog = "2.8"
# release: URL schemes mineded:// and mineup:// (registered by the installers)
tauri-plugin-deep-link = "2.6"
# lead: one running instance (forwards deep links to it); file logs
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

[target.'cfg(windows)'.dependencies]
windows-version = "0.1"

[lints]
workspace = true
