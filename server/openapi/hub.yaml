openapi: 3.1.0
info:
  title: Launcher Hub API
  version: 1.0.0
  description: |
    CONTRACT (lead). Rooms/signaling, mirror list and skin library for the launcher.
    Implemented by `server/hub` (owner: server-ops), consumed by `lc-p2p`, `lc-http`,
    `lc-accounts`. Yggdrasil auth itself is served by Drasl (see `yggdrasil.md`).

    Auth: `Authorization: Bearer <Yggdrasil accessToken>` — hub validates it against
    Drasl (`/authserver/validate`). Endpoints marked `security: []` are public.

    Errors use the same shape as the launcher `AppError`: `{code, message, details}`.
  license:
    name: GPL-3.0-or-later
    identifier: GPL-3.0-or-later
servers:
  - url: https://{domain}/api/v1
    variables:
      domain:
        default: mc.example.ru
security:
  - bearer: []
tags:
  - name: catalog
    description: Limited public Minecraft content catalogue broker.
  - name: system
    description: Health and dynamic configuration (mirrors).
  - name: skins
    description: Skin library on top of Drasl textures.
  - name: rooms
    description: P2P room registry, tokens and fallback signaling.
  - name: vpn
    description: Personal MineDed VPN access (one key per Yggdrasil profile, monthly quota).
  - name: chat
    description: Global chat, direct messages, friends, privacy, moderation and admin tools (docs/plans/chat.md).

paths:
  /catalog/curseforge/mods:
    $ref: './curseforge.json#/paths/~1mods'
  /catalog/curseforge/files:
    $ref: './curseforge.json#/paths/~1files'
  /catalog/curseforge/mods/search:
    $ref: './curseforge.json#/paths/~1mods~1search'
  /catalog/curseforge/mods/{modId}:
    $ref: './curseforge.json#/paths/~1mods~1{modId}'
  /catalog/curseforge/mods/{modId}/files:
    $ref: './curseforge.json#/paths/~1mods~1{modId}~1files'
  /catalog/curseforge/mods/{modId}/files/{fileId}:
    $ref: './curseforge.json#/paths/~1mods~1{modId}~1files~1{fileId}'
  /catalog/curseforge/files/{fileId}:
    $ref: './curseforge.json#/paths/~1files~1{fileId}'
  /catalog/curseforge/mods/{modId}/files/{fileId}/download-url:
    $ref: './curseforge.json#/paths/~1mods~1{modId}~1files~1{fileId}~1download-url'
  /chat/me:
    get:
      tags: [chat]
      operationId: chatMe
      summary: Register or refresh the authenticated caller and return SocialUser with server-verified role
      responses:
        "200": { description: SocialUser, content: { application/json: { schema: { $ref: "#/components/schemas/Social" } } } }
        "401": { $ref: "#/components/responses/Error" }
  /chat/ws:
    get:
      tags: [chat]
      operationId: chatSocket
      summary: WebSocket upgrade; server pushes SocialEvent JSON frames, client sends presence/typing
      description: |
        Native clients authenticate through the Authorization Bearer header; query tokens are rejected.
        Client frames are {"type":"presence","status":"online"|"inGame"|"inRoom"|"offline"}.
        Status visibility is enforced per recipient using privacy settings and blocks.
      responses:
        "101": { description: Switching protocols }
        "401": { $ref: "#/components/responses/Error" }
  /chat/channels:
    get:
      tags: [chat]
      operationId: chatChannels
      summary: Global chat + the caller's direct chats (SocialChannel[])
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Social" } } } } }
        "401": { $ref: "#/components/responses/Error" }
  /chat/channels/{channel}/messages:
    parameters:
      - { name: channel, in: path, required: true, schema: { type: string } }
    get:
      tags: [chat]
      operationId: chatHistory
      summary: History page newest last (SocialHistory); query `before`, `limit` (≤100)
      parameters:
        - { name: before, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, maximum: 100 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Social" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [chat]
      operationId: chatSend
      summary: Post SocialContent (text, roomInvite, packShare, attachment by id). 422 reason filtered/muted for the public chat
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Social" } } } }
      responses:
        "200": { description: SocialMessage, content: { application/json: { schema: { $ref: "#/components/schemas/Social" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /chat/channels/{channel}/read:
    parameters:
      - { name: channel, in: path, required: true, schema: { type: string } }
    post:
      tags: [chat]
      operationId: chatMarkRead
      summary: Body {messageId}
      responses:
        "204": { description: OK }
        "401": { $ref: "#/components/responses/Error" }
  /chat/files:
    post:
      tags: [chat]
      operationId: chatUpload
      summary: multipart `file` (≤ 10 MB) → SocialAttachment; images re-encoded to WebP + thumbnail. 507 when uploads are paused (disk ≥ 95 %)
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, properties: { file: { type: string, format: binary } } } } } }
      responses:
        "200": { description: SocialAttachment, content: { application/json: { schema: { $ref: "#/components/schemas/Social" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "507": { $ref: "#/components/responses/Error" }
  /chat/files/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [chat]
      operationId: chatDownload
      summary: Attachment bytes (`?thumb=1` for the preview); only members of a channel that contains it
      responses:
        "200": { description: File }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /chat/messages/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      tags: [chat]
      operationId: chatDelete
      summary: Author deletes own message; moderators/admins any public message
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /chat/messages/{id}/report:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [chat]
      operationId: chatReport
      summary: Body {reason?}
      responses:
        "204": { description: Reported }
        "401": { $ref: "#/components/responses/Error" }
  /chat/users:
    get:
      tags: [chat]
      operationId: chatSearchUsers
      summary: Search by name prefix, `?q=` (≥2 chars) → SocialUser[]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Social" } } } } }
        "401": { $ref: "#/components/responses/Error" }
  /chat/users/{uuid}:
    parameters:
      - { name: uuid, in: path, required: true, schema: { type: string } }
    get:
      tags: [chat]
      operationId: chatProfile
      summary: SocialUser (status hidden per privacy)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Social" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /chat/users/{uuid}/direct:
    parameters:
      - { name: uuid, in: path, required: true, schema: { type: string } }
    post:
      tags: [chat]
      operationId: chatOpenDirect
      summary: Open or get the direct channel; 403 when privacy or a block forbids it
      responses:
        "200": { description: SocialChannel, content: { application/json: { schema: { $ref: "#/components/schemas/Social" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /chat/users/{uuid}/block:
    parameters:
      - { name: uuid, in: path, required: true, schema: { type: string } }
    put: { tags: [chat], operationId: chatBlock, summary: Block, responses: { "204": { description: OK }, "401": { $ref: "#/components/responses/Error" } } }
    delete: { tags: [chat], operationId: chatUnblock, summary: Unblock, responses: { "204": { description: OK }, "401": { $ref: "#/components/responses/Error" } } }
  /chat/friends:
    get:
      tags: [chat]
      operationId: chatFriends
      summary: SocialFriend[] (friends and pending requests)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Social" } } } } }
        "401": { $ref: "#/components/responses/Error" }
  /chat/friends/{uuid}:
    parameters:
      - { name: uuid, in: path, required: true, schema: { type: string } }
    put:
      tags: [chat]
      operationId: chatAddFriend
      summary: Send or accept a request → SocialFriend; 403 per privacy
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Social" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    delete: { tags: [chat], operationId: chatRemoveFriend, summary: Remove/decline/cancel, responses: { "204": { description: OK }, "401": { $ref: "#/components/responses/Error" } } }
  /chat/privacy:
    get:
      tags: [chat]
      operationId: chatPrivacy
      summary: SocialPrivacy of the caller
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Social" } } } }
        "401": { $ref: "#/components/responses/Error" }
    put:
      tags: [chat]
      operationId: chatSetPrivacy
      summary: Replace SocialPrivacy
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Social" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Social" } } } }
        "401": { $ref: "#/components/responses/Error" }
  /chat/mod/reports:
    get:
      tags: [chat]
      operationId: chatReports
      summary: Moderators/admins - open SocialReport[]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Social" } } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /chat/mod/reports/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete: { tags: [chat], operationId: chatResolveReport, summary: Resolve, responses: { "204": { description: OK }, "401": { $ref: "#/components/responses/Error" }, "403": { $ref: "#/components/responses/Error" } } }
  /chat/mod/users/{uuid}:
    parameters:
      - { name: uuid, in: path, required: true, schema: { type: string } }
    post:
      tags: [chat]
      operationId: chatModerateUser
      summary: Body {action mute|ban|unmute|unban, seconds?}; moderators mute ≤ 86400 s, ban is admin only
      responses:
        "204": { description: OK }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /chat/admin/roles/{uuid}:
    parameters:
      - { name: uuid, in: path, required: true, schema: { type: string } }
    put:
      tags: [chat]
      operationId: chatSetRole
      summary: Admin (Drasl isAdmin) only - body {role user|moderator}
      responses:
        "204": { description: OK }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /chat/admin/server:
    get:
      tags: [chat]
      operationId: chatServerState
      summary: Admin only - AdminServerState (disk, backup, migration)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Social" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /chat/admin/migrate:
    post:
      tags: [chat]
      operationId: chatMigrateStorage
      summary: Admin only - body {target newDisk|objectStorage}; progress via WS admin events
      responses:
        "202": { description: Started }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /me/vpn:
    get:
      tags: [vpn]
      operationId: getVpnAccess
      summary: The caller's VPN access and usage
      responses:
        "200":
          description: Access exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VpnAccess" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [vpn]
      operationId: provisionVpnAccess
      summary: Create the caller's VPN key (idempotent; returns the existing one)
      description: >-
        Creates a panel client bound to the profile UUID with the default monthly quota
        (256 GiB). Rate-limited per profile. 503 when the VPN backend is unavailable.
      responses:
        "200":
          description: Access (existing or new)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VpnAccess" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /health:
    get:
      tags: [system]
      operationId: health
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: { type: string, enum: [ok] }
                  version: { type: string }

  /mirrors:
    get:
      tags: [system]
      operationId: getMirrors
      summary: Current mirror list per upstream (launcher refreshes it on start)
      security: []
      responses:
        "200":
          description: Map of upstream key → ordered mirror base URLs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mirrors" }

  /skins:
    get:
      tags: [skins]
      operationId: listSkins
      summary: Skin library of the caller (or public library)
      parameters:
        - name: owner
          in: query
          schema: { type: string, enum: [me, public], default: me }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Page of skins
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Skin" }
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [skins]
      operationId: uploadSkin
      summary: Upload a PNG (64x64 or 64x32) to the library
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, model, name]
              properties:
                file: { type: string, format: binary }
                model: { $ref: "#/components/schemas/SkinModel" }
                name: { type: string, maxLength: 64 }
                public: { type: boolean, default: false }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Skin" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }

  /skins/{id}:
    delete:
      tags: [skins]
      operationId: deleteSkin
      summary: Delete a skin from the caller's library
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /me/skin:
    post:
      tags: [skins]
      operationId: setActiveSkin
      summary: Make a library skin the active texture of the caller's Yggdrasil profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skinId]
              properties:
                skinId: { type: string, format: uuid }
      responses:
        "204": { description: Applied (visible via Drasl texture server) }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /rooms:
    post:
      tags: [rooms]
      operationId: createRoom
      summary: Host registers a room; returns a human code
      description: |
        Bearer is required for `yggdrasil` rooms. `open` rooms (offline host) may be created
        anonymously, with strict per-IP limits (≤2 active rooms, ≤10 creates/hour; 429 →
        `rateLimited`).
      security: [{}, { bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpointId, authMode]
              properties:
                endpointId: { type: string, description: iroh endpoint id of the host }
                kind: { type: string, enum: [game, voice], default: game, description: "`voice` = chat/voice only, no game tunnel" }
                sig: { $ref: "#/components/schemas/InstanceSig", description: Required for `game` rooms, absent for `voice` }
                authMode: { type: string, enum: [yggdrasil, open] }
                maxPeers: { type: integer, minimum: 2, maximum: 16, default: 8 }
                passwordProtected: { type: boolean, default: false, description: The host checks the password itself over P2P; hub never sees it }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [roomId, code, hostToken, expiresAt, relayUrls]
                properties:
                  roomId: { type: string, format: uuid }
                  code: { type: string, pattern: "^[A-Z0-9]{4}-[A-Z0-9]{4}$" }
                  hostToken: { type: string }
                  expiresAt: { type: string, format: date-time }
                  relayUrls: { type: array, items: { type: string, format: uri } }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /rooms/{code}/join:
    post:
      tags: [rooms]
      operationId: joinRoom
      summary: Guest joins by code and gets a peer token
      description: |
        Bearer is required for `yggdrasil` rooms and optional for `open` ones; rate-limited per
        IP (429 → code `rateLimited`). A room counts only live members: a guest is a member while
        its room WebSocket is connected, or for 60 s after join if it never connects; `leave`,
        WS close and kick free the slot.

        Replacing an existing live endpoint requires the same validated profile identity.
        Anonymous duplicate endpoints return 409; a supplied name or UUID is not proof of
        ownership. An invalid supplied bearer is rejected instead of treated as anonymous.

        `peerToken` = `<exp>.<uuid>.<mac>`: `exp` is unix seconds (join + 10 min); `uuid` is the
        undashed profile UUID from the validated bearer, or `-` for anonymous joins; `mac` is
        base64url (no padding) of HMAC-SHA256(key = hostToken, msg = "lc-peer/2|" + roomId + "|"
        + endpointId + "|" + uuid + "|" + exp). The host verifies it offline against the
        connecting iroh endpoint id (bound to that endpoint) and uses the token's `uuid` — not
        the one in `Hello` — as the identity for bans in `yggdrasil` rooms.
        For password-protected rooms the host verifies the password over P2P. The peer token
        alone does not grant access to the room's fallback WebSocket.
      security: [{}, { bearer: [] }]
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpointId]
              properties:
                endpointId: { type: string }
                name: { type: string, maxLength: 16, description: Display name shown to the room }
                uuid: { type: string, description: Profile UUID (taken from the token when authenticated) }
      responses:
        "200":
          description: Joined; connect to the host via iroh with `peerToken` in `Hello`
          content:
            application/json:
              schema:
                type: object
                required: [roomId, peerToken, hostEndpointId, kind, authMode, relayUrls, passwordProtected]
                properties:
                  roomId: { type: string, format: uuid }
                  peerToken: { type: string }
                  hostEndpointId: { type: string }
                  kind: { type: string, enum: [game, voice] }
                  sig: { $ref: "#/components/schemas/InstanceSig", description: Absent for voice rooms }
                  authMode: { type: string, enum: [yggdrasil, open] }
                  relayUrls: { type: array, items: { type: string, format: uri } }
                  passwordProtected: { type: boolean }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /rooms/{roomId}:
    delete:
      tags: [rooms]
      operationId: closeRoom
      summary: Host closes the room
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Closed }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /rooms/{roomId}/ws:
    get:
      tags: [rooms]
      operationId: roomSocket
      summary: WebSocket for presence and fallback chat
      description: |
        Upgrade to WebSocket. Auth via `?token=<hostToken|peerToken>` (browsers can't set headers).
        In password-protected rooms only the host token is accepted. Guest peer tokens return
        403 `permissionDenied` because the hub cannot verify the host's P2P password admission.
        Guests use the authenticated P2P connection for chat and presence instead.
        Messages are JSON objects with a `t` field:
        - server → client: `peer_joined {peerId,name}`, `peer_left {peerId}`, `kick {peerId,reason}`,
          `chat {id,fromPeer,fromName,text,sentAt}`, `host_endpoint {endpointId}`, `closed {}`
        - client → server: `chat {id,text}`, `ping {nonce}`, `leave {}` (guest frees its slot),
          `kick {peerId,reason}` (host only)
      security: []
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        "101": { description: Switching protocols }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Social:
      description: >-
        Chat payloads mirror the Rust types in crates/lc-types/src/social.rs (camelCase JSON):
        SocialChannel, SocialHistory, SocialMessage, SocialContent (tagged by `type`), SocialAttachment,
        SocialUser, SocialFriend, SocialPrivacy, SocialReport, AdminServerState. Roles: admin = Drasl isAdmin,
        moderator = assigned in hub. Owner identity is never configured in the repo.
      type: object
      additionalProperties: true
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, examples: [notFound, authRequired, invalidInput, notImplemented] }
        message: { type: string }
        details:
          type: [object, "null"]
          additionalProperties: { type: string }
    SkinModel:
      type: string
      enum: [classic, slim]
    Skin:
      type: object
      required: [id, name, model, hash, url]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        model: { $ref: "#/components/schemas/SkinModel" }
