[package]
name = "lc-accounts"
description = "Offline and Yggdrasil/authlib-injector accounts, keyring, skins. Owner: accounts."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lc-types.workspace = true
lc-runtime.workspace = true
lc-http.workspace = true
async-trait.workspace = true
url.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
tracing = "0.1.44"
md-5 = "0.10"
chacha20poly1305 = "0.10"
reqwest = { workspace = true, features = ["multipart"] }
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["net"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3", features = ["async-secret-service", "tokio", "crypto-rust"] }

[lints]
workspace = true
