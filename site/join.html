<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Приглашение в MineDed</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css?v=9">
<style>
  .doc { max-width: 560px; margin: 6vh auto 24px; padding: clamp(20px, 4vw, 40px); text-align: center; }
  .join-logo { width: 72px !important; height: 72px !important; max-width: 72px !important; margin: 0 auto 8px; display: block; image-rendering: pixelated; }
  .code { font: 700 2rem/1.2 ui-monospace, monospace; letter-spacing: .08em; margin: 12px 0 20px; user-select: all; }
  .doc .btn { margin: 6px; }
</style>
</head>
<body>
<div id="bg" class="bg" aria-hidden="true"></div>
<main class="doc panel">
  <img class="join-logo" src="/logo.svg" alt="MineDed" width="72" height="72">
  <h1 id="title">Приглашение в MineDed</h1>
  <p id="hint" class="muted">Открываем лаунчер…</p>
  <p class="code" id="code"></p>
  <p>
    <a class="btn primary" id="open" href="#">Открыть в лаунчере</a>
    <a class="btn" href="/#download">Скачать MineDed</a>
  </p>
  <p class="small muted">Лаунчер не открылся? Установите его, затем нажмите «Открыть в лаунчере» или введите код
    вручную: Мультиплеер → Войти.</p>
</main>
<script src="/scenes.js?v=9"></script>
<script src="/join.js?v=9"></script>
</body>
</html>
